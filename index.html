<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crossman — Crossword meets Hangman</title>
  <meta name="theme-color" content="#f4f1ea" />
  <meta name="description" content="Crossman: a crossword crossed with hangman. Guess letters, crack cryptic clues, and keep the balloon cat out of the pond." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎈</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Cross<span>man</span></h1>
    <p class="tagline">Guess a letter and it fills in everywhere in the grid. Your letter guesses are limited, so finish by solving words. Six mistakes will sink the cat.</p>
    <div class="controls">
      <label>Difficulty
        <select id="difficulty">
          <option value="easy">Easy: 8 clues, 10 letters</option>
          <option value="medium" selected>Medium: 6 clues, 8 letters</option>
          <option value="hard">Hard: 4 clues, 6 letters</option>
        </select>
      </label>
      <label>Clues
        <select id="clueStyle">
          <option value="cryptic" selected>Cryptic</option>
          <option value="quick">Quick</option>
        </select>
      </label>
      <button id="newGame">New game</button>
      <button id="giveUp" class="secondary">Give up</button>
      <button id="howTo" class="secondary">How to play</button>
    </div>
  </header>

  <main>
    <section class="board-area">
      <div id="grid" class="grid"></div>
      <div id="solveBox" class="solve-box hidden">
        <div id="solveLabel" class="solve-label"></div>
        <form id="solveForm" autocomplete="off">
          <input id="solveInput" type="text" spellcheck="false" placeholder="Type the whole word…" />
          <button type="submit">Solve</button>
          <button type="button" id="solveCancel" class="secondary">✕</button>
        </form>
      </div>
      <div id="keyboard" class="keyboard"></div>
      <div id="message" class="message"></div>
    </section>

    <aside class="side">
      <div class="status">
        <div class="scene-wrap">
        <svg id="catScene" class="cat-scene" viewBox="0 0 160 200" data-mood="happy" style="--stage:0">
          <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#cfe9ff" /><stop offset="1" stop-color="#f7fbff" />
            </linearGradient>
            <clipPath id="sceneClip"><rect width="160" height="200" rx="12" /></clipPath>
          </defs>
          <g clip-path="url(#sceneClip)">
          <rect width="160" height="200" fill="url(#sky)" />
          <g class="cloud c1"><ellipse cx="30" cy="30" rx="14" ry="6" /><ellipse cx="38" cy="26" rx="9" ry="7" /></g>
          <g class="cloud c2"><ellipse cx="132" cy="64" rx="12" ry="5" /><ellipse cx="138" cy="60" rx="7" ry="6" /></g>

          <g id="floater"><g id="bob">
          <g class="balloon" data-i="0">
            <g class="bshape">
              <path class="string" d="M80 30.0 Q90 54 99 69" />
              <ellipse cx="80" cy="16" rx="10" ry="12.5" fill="#ff6b6b" />
              <path d="M78 30.5 L82 30.5 L80 28.0 Z" fill="#ff6b6b" />
              <ellipse cx="76.5" cy="11.5" rx="2.6" ry="4" fill="#fff" opacity="0.55" />
            </g>
            <text class="pop" x="80" y="20">POP!</text>
          </g>
          <g class="balloon" data-i="1">
            <g class="bshape">
              <path class="string" d="M63 42.0 Q81 60 99 69" />
              <ellipse cx="63" cy="28" rx="10" ry="12.5" fill="#ffd43b" />
              <path d="M61 42.5 L65 42.5 L63 40.0 Z" fill="#ffd43b" />
              <ellipse cx="59.5" cy="23.5" rx="2.6" ry="4" fill="#fff" opacity="0.55" />
            </g>
            <text class="pop" x="63" y="32">POP!</text>
          </g>
          <g class="balloon" data-i="2">
            <g class="bshape">
              <path class="string" d="M97 42.0 Q98 60 99 69" />
              <ellipse cx="97" cy="28" rx="10" ry="12.5" fill="#69db7c" />
              <path d="M95 42.5 L99 42.5 L97 40.0 Z" fill="#69db7c" />
              <ellipse cx="93.5" cy="23.5" rx="2.6" ry="4" fill="#fff" opacity="0.55" />
            </g>
            <text class="pop" x="97" y="32">POP!</text>
          </g>
          <g class="balloon" data-i="3">
            <g class="bshape">
              <path class="string" d="M48 60.0 Q74 69 99 69" />
              <ellipse cx="48" cy="46" rx="10" ry="12.5" fill="#4dabf7" />
              <path d="M46 60.5 L50 60.5 L48 58.0 Z" fill="#4dabf7" />
              <ellipse cx="44.5" cy="41.5" rx="2.6" ry="4" fill="#fff" opacity="0.55" />
            </g>
            <text class="pop" x="48" y="50">POP!</text>
          </g>
          <g class="balloon" data-i="4">
            <g class="bshape">
              <path class="string" d="M112 60.0 Q106 69 99 69" />
              <ellipse cx="112" cy="46" rx="10" ry="12.5" fill="#da77f2" />
              <path d="M110 60.5 L114 60.5 L112 58.0 Z" fill="#da77f2" />
              <ellipse cx="108.5" cy="41.5" rx="2.6" ry="4" fill="#fff" opacity="0.55" />
            </g>
            <text class="pop" x="112" y="50">POP!</text>
          </g>
          <g class="balloon" data-i="5">
            <g class="bshape">
              <path class="string" d="M80 55.0 Q90 66 99 69" />
              <ellipse cx="80" cy="41" rx="10" ry="12.5" fill="#ff922b" />
              <path d="M78 55.5 L82 55.5 L80 53.0 Z" fill="#ff922b" />
              <ellipse cx="76.5" cy="36.5" rx="2.6" ry="4" fill="#fff" opacity="0.55" />
            </g>
            <text class="pop" x="80" y="45">POP!</text>
          </g>
            <g class="cat">
              <path class="fur-line" d="M92 121 q18 3 13 -15" stroke-width="4.5" />
              <ellipse class="fur" cx="80" cy="117" rx="13" ry="12" />
              <ellipse cx="80" cy="120" rx="7" ry="7.5" fill="#fde3c8" />
              <ellipse class="fur" cx="74" cy="129" rx="4" ry="3.2" />
              <ellipse class="fur" cx="86" cy="129" rx="4" ry="3.2" />
              <path class="fur-line arm-down" d="M69 111 q-7 5 -5 11" stroke-width="4.5" />
              <path class="fur" d="M64 84 L63 64 L77 77 Z" /><path d="M66 79 L65.5 69 L73 76 Z" fill="#f7a8b8" />
              <path class="fur" d="M96 84 L97 64 L83 77 Z" /><path d="M94 79 L94.5 69 L87 76 Z" fill="#f7a8b8" />
              <ellipse class="fur" cx="80" cy="91" rx="18" ry="15" />
              <path d="M76 78 l1 4 M80 77 v4.5 M84 78 l-1 4" stroke="#c46d2a" stroke-width="1.4" stroke-linecap="round" />
              <g class="whiskers">
                <path d="M68 95 L56 93 M68 97.5 L56 99 M92 95 L104 93 M92 97.5 L104 99" />
              </g>
              <path d="M78.3 94 h3.4 l-1.7 2.2 Z" fill="#e8798f" />

              <g class="face face-happy">
                <path class="ink" d="M69.5 90 q3.2 -4 6.4 0 M84.1 90 q3.2 -4 6.4 0" />
                <path class="ink" d="M76 98.5 q2 2.4 4 0 q2 2.4 4 0" />
              </g>
              <g class="face face-worried">
                <circle cx="72.7" cy="89.5" r="2.3" fill="#1f2430" /><circle cx="87.3" cy="89.5" r="2.3" fill="#1f2430" />
                <path class="ink" d="M69 84.5 l6 -1.5 M91 84.5 l-6 -1.5" />
                <ellipse cx="80" cy="100" rx="1.8" ry="2" fill="#1f2430" />
              </g>
              <g class="face face-scared">
                <circle cx="72.5" cy="89" r="4.3" fill="#fff" stroke="#1f2430" stroke-width="1.2" />
                <circle cx="87.5" cy="89" r="4.3" fill="#fff" stroke="#1f2430" stroke-width="1.2" />
                <circle cx="72.5" cy="89.5" r="1.4" fill="#1f2430" /><circle cx="87.5" cy="89.5" r="1.4" fill="#1f2430" />
                <path class="ink" d="M75 100.5 q1.25 -2 2.5 0 q1.25 2 2.5 0 q1.25 -2 2.5 0 q1.25 2 2.5 0" />
                <path class="sweat" d="M101 78 q-3 5 0 6.5 q3 -1.5 0 -6.5 Z" />
              </g>
              <g class="face face-grumpy">
                <path class="ink" d="M69 88 h7 M84 88 h7" />
                <path d="M69 88 a3.5 3 0 0 0 7 0 Z M84 88 a3.5 3 0 0 0 7 0 Z" fill="#1f2430" />
                <path class="ink" d="M76 100.5 q4 -3.5 8 0" />
                <ellipse class="lilypad" cx="80" cy="75" rx="11" ry="3.4" />
                <path class="drip d1" d="M64 92 q-1.5 2.5 0 3.5 q1.5 -1 0 -3.5 Z" />
                <path class="drip d2" d="M96 90 q-1.5 2.5 0 3.5 q1.5 -1 0 -3.5 Z" />
              </g>
              <g class="face face-joy">
                <path class="ink" d="M69.5 90 q3.2 -4 6.4 0 M84.1 90 q3.2 -4 6.4 0" />
                <path d="M75.5 98 q4.5 6 9 0 Z" fill="#c2255c" stroke="#1f2430" stroke-width="1.2" stroke-linejoin="round" />
                <circle cx="69" cy="95" r="2.6" fill="#ff8fab" opacity="0.7" /><circle cx="91" cy="95" r="2.6" fill="#ff8fab" opacity="0.7" />
              </g>

              <path class="fur-line" d="M91 111 Q106 91 99 71" stroke-width="5" />
              <circle class="fur" cx="99" cy="69" r="3.4" />
            </g>
          </g></g>

          <g class="splash">
          <circle class="drop" cx="80" cy="170" r="2.6" style="--dx:-26px;--dy:-26px" />
          <circle class="drop" cx="80" cy="170" r="2.2" style="--dx:-14px;--dy:-36px" />
          <circle class="drop" cx="80" cy="170" r="2.8" style="--dx:0px;--dy:-42px" />
          <circle class="drop" cx="80" cy="170" r="2.2" style="--dx:14px;--dy:-36px" />
          <circle class="drop" cx="80" cy="170" r="2.6" style="--dx:26px;--dy:-26px" />
          <circle class="drop" cx="80" cy="170" r="2" style="--dx:-36px;--dy:-12px" />
          <circle class="drop" cx="80" cy="170" r="2" style="--dx:36px;--dy:-12px" />
          </g>
          <g class="pond">
            <rect x="0" y="171" width="160" height="30" fill="#4dabf7" />
            <path class="wave" d="M-40 171 q5 -3.5 10 0 q5 3.5 10 0 q5 -3.5 10 0 q5 3.5 10 0 q5 -3.5 10 0 q5 3.5 10 0 q5 -3.5 10 0 q5 3.5 10 0 q5 -3.5 10 0 q5 3.5 10 0 q5 -3.5 10 0 q5 3.5 10 0 q5 -3.5 10 0 q5 3.5 10 0 q5 -3.5 10 0 q5 3.5 10 0 q5 -3.5 10 0 q5 3.5 10 0 q5 -3.5 10 0 q5 3.5 10 0 q5 -3.5 10 0 q5 3.5 10 0 V200 H-40 Z" fill="#74c0fc" />
          </g>
          <g class="frog">
            <ellipse cx="136" cy="178" rx="14" ry="3.6" fill="#40c057" />
            <text x="136" y="178" text-anchor="middle" font-size="15">🐸</text>
          </g>
          </g>
        </svg>
        <div id="catSay" class="cat-say"></div>
        </div>
        <div class="stats">
          <div><span id="lives"></span> lives left</div>
          <div><span id="lettersLeft"></span> of <span id="letterBudget"></span> letter guesses left</div>
          <div><span id="wordsLeft"></span> words to go</div>
          <div class="score">Score: <span id="score">0</span></div>
        </div>
      </div>
      <div class="clues">
        <div>
          <h2>Across</h2>
          <ol id="acrossList"></ol>
        </div>
        <div>
          <h2>Down</h2>
          <ol id="downList"></ol>
        </div>
      </div>
    </aside>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <button id="modalBtn">OK</button>
    </div>
  </div>

  <script src="words.js"></script>
  <script src="generator.js"></script>
  <script src="game.js"></script>
</body>
</html>
